        /* Part Card Styling */

            position: relative;
            z-index: 1;
        }

        .part-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--primary-red);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .part-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .part-card:hover::before {
            transform: scaleX(1);
        }

            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 220px;
        }

        .img-container img {
            max-height: 100%;
            transition: transform 0.5s ease;
        }

        .part-card:hover img {
            transform: scale(1.1) rotate(2deg);
        }

        /* Content Styling */

            padding: 20px;
            background: white;
        }

        .part-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #222;

/* Position the notification badge */
.whatsapp-notify {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 20px;
    height: 20px;
    background-color: #d90429; /* Red color matching your theme */
    color: white;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #ffffff;
    /* Apply the animation */
    animation: pulse-red 2s infinite;
}

/* The Pulsing Animation Logic */
@keyframes pulse-red {
    0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(217, 4, 41, 0.7);
    }
    70% {
        transform: scale(1);
        box-shadow: 0 0 0 10px rgba(217, 4, 41, 0);
    }
    100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(217, 4, 41, 0);
    }
}
