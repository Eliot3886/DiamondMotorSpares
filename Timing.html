        :root {

        body {

        /* Hero Header Section */
        .engine-header {
            background: linear-gradient(#0c2340);
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 0;
            border-bottom: 5px solid var(--primary-red);
            position: sticky;
        }

        /* Breadcrumb styling */
        .breadcrumb-item a { color: white; font-size: 1.3rem; text-decoration: none; transition: transform 0.25s ease, color 0.25s ease;}
    .breadcrumb-item a:hover { color: red; background-color: white; border-radius: 25px; transform: translateY(-3px); font-size: 1.32rem;
    }
        .breadcrumb-item.active { color: var(--primary-red); font-size: 1.3rem; text-decoration: none; transition: transform 0.25s ease, color 0.25s ease;}

        /* Part Card Styling */
        .part-card {
            background: #ffffff;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1;
        }

        .part-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--primary-red);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .part-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .part-card:hover::before {
            transform: scaleX(1);
        }

        /* Image Container */
        .img-container {
            background: #fdfdfd;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 220px;
        }

        .img-container img {
            max-height: 100%;
            transition: transform 0.5s ease;
        }

        .part-card:hover img {
            transform: scale(1.1) rotate(2deg);
        }

        /* Content Styling */
        .part-info {
            padding: 20px;
            background: white;
        }

        .part-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 5px;
        }

        .part-sku {
            color: #999;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 15px;
        }

        /* Inquire Button */

            background-color: #0c2340;
            color: white;
            border-radius: 50px;
            padding: 8px 25px;
            font-weight: 600;
            transition: 0.3s;
            border: 2px solid var(--dark-bg);
            width: 100%;
        }

        .btn-inquire:hover {
            background-color: var(--primary-red);
            border-color: var(--primary-red);
            color: white;
            box-shadow: 0 5px 15px rgba(227, 30, 36, 0.3);
        }

        /* Badge for "In Stock" */
        .stock-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            padding: 4px 12px;

            font-size: 0.7rem;
